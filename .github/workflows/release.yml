name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.49)'
        required: true
        type: string
      include_macos:
        description: 'Include macOS build (10x minutes cost)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codesearch-windows-x86_64.zip
            artifact_csharp: codesearch-windows-x86_64-with-csharp.zip
            dotnet_rid: win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: codesearch-linux-x86_64.tar.gz
            artifact_csharp: codesearch-linux-x86_64-with-csharp.tar.gz
            dotnet_rid: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      # pin@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pin ref so workflow_dispatch builds the tagged commit (inputs.version),
          # not the default branch (master-tip) — otherwise binaries get labeled
          # with a version they weren't built from (#161-class mismatch).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - name: Install Rust
        # pin@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        # pin@v3
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Cache cargo
        # pin@v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_DIR: target

      - name: Setup .NET
        # pin@v4
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Publish C# helper (self-contained single-file)
        run: dotnet publish helpers/csharp -c Release -r ${{ matrix.dotnet_rid }} --self-contained -p:PublishSingleFile=true -o helpers-publish

      - name: Package kale (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target\${{ matrix.target }}\release\codesearch.exe -DestinationPath ${{ matrix.artifact }}

      - name: Package kale (Linux)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release codesearch

      - name: Package with-csharp (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -Path staging\helpers\csharp -ItemType Directory -Force
          Copy-Item target\${{ matrix.target }}\release\codesearch.exe staging\
          Copy-Item -Recurse helpers-publish\* staging\helpers\csharp\
          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.artifact_csharp }}

      # D1 — same cp-retry pattern as the macOS "Package with-csharp" step (which
      # broke v1.1.31 under APFS disk pressure, see build-macos job below). The
      # Linux runner has ~84GB disk and ext4 (no fcopyfile EIO failure mode), so
      # this isn't fixing an observed failure — it's preventive consistency so
      # both platforms fail the same transient-copy-error way instead of one
      # silently hard-failing on the first attempt.
      - name: Package with-csharp (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging/helpers/csharp
          for i in 1 2 3; do
            if cp target/${{ matrix.target }}/release/codesearch staging/codesearch; then break; fi
            echo "cp attempt $i/3 failed, retrying in 5s…"
            df -h /
            sleep 5
          done
          test -f staging/codesearch
          cp -r helpers-publish/* staging/helpers/csharp/
          tar czf ${{ matrix.artifact_csharp }} -C staging .

      - name: Upload kale artifact
        # pin@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload with-csharp artifact
        # pin@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_csharp }}
          path: ${{ matrix.artifact_csharp }}

  build-macos:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_macos)
    runs-on: macos-latest
    steps:
      # pin@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pin ref so workflow_dispatch builds the tagged commit (inputs.version),
          # not the default branch (master-tip) — otherwise binaries get labeled
          # with a version they weren't built from (#161-class mismatch).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - name: Install Rust
        # pin@stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-apple-darwin

      - name: Install protoc
        # pin@v3
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        # pin@v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: aarch64-apple-darwin-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            aarch64-apple-darwin-cargo-

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin
        env:
          CARGO_TARGET_DIR: target

      # C1 + C4 — Stage binary out of target/, then cargo clean to free ~5-10GB on
      # the 14GB macOS runner. APFS fcopyfile() can return EIO under disk pressure
      # (instead of the clean ENOSPC), which is what broke v1.1.31's macOS packaging.
      # df -h logging for post-mortem diagnosis. Binary is moved (atomic rename within
      # the same filesystem — no copyfile syscall) before clean, so it survives.
      - name: Stage binary & free disk space
        run: |
          echo "=== Disk usage before staging ==="
          df -h /
          mkdir -p staging-release
          mv target/aarch64-apple-darwin/release/codesearch staging-release/codesearch
          cargo clean
          echo "=== Disk usage after cargo clean ==="
          df -h /

      - name: Setup .NET
        # pin@v4
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Publish C# helper (self-contained single-file)
        run: dotnet publish helpers/csharp -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o helpers-publish

      # C3 — Retry loop on tar/cp. set -e safe via if/then (failed condition doesn't
      # trigger exit-on-error). df -h on each failure for diagnosis. Final test -f
      # forces a hard failure if all 3 attempts failed.
      - name: Package kale
        run: |
          for i in 1 2 3; do
            if tar czf codesearch-macos-arm64.tar.gz -C staging-release codesearch; then break; fi
            echo "tar attempt $i/3 failed, retrying in 5s…"
            df -h /
            sleep 5
          done
          test -f codesearch-macos-arm64.tar.gz

      - name: Package with-csharp
        run: |
          mkdir -p staging/helpers/csharp
          for i in 1 2 3; do
            if cp staging-release/codesearch staging/codesearch; then break; fi
            echo "cp attempt $i/3 failed, retrying in 5s…"
            df -h /
            sleep 5
          done
          test -f staging/codesearch
          cp -r helpers-publish/* staging/helpers/csharp/
          tar czf codesearch-macos-arm64-with-csharp.tar.gz -C staging .

      - name: Upload kale artifact
        # pin@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codesearch-macos-arm64.tar.gz
          path: codesearch-macos-arm64.tar.gz

      - name: Upload with-csharp artifact
        # pin@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codesearch-macos-arm64-with-csharp.tar.gz
          path: codesearch-macos-arm64-with-csharp.tar.gz

  release:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        # pin@v4
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codesearch-*
          path: artifacts
          merge-multiple: true

      - name: Create or update Release
        # pin@v2
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ inputs.version || github.ref_name }}

  # Container image: one native build per architecture (no QEMU for the Rust
  # build), pushed by digest, then merged into one multi-arch manifest.
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # pin@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      # pin@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # pin@v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        # pin@v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=codesearch-${{ matrix.arch }}
          cache-to: type=gha,scope=codesearch-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        # pin@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        # pin@v4
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true

      # pin@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # pin@v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (vX.Y.Z, X.Y.Z, X.Y, latest)
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags=(-t "${IMAGE}:v${version}" -t "${IMAGE}:${version}")
          # Pre-releases (1.7.0-rc.1) get only their exact tags.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=(-t "${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" -t "${IMAGE}:latest")
          fi
          sources=()
          for digest in digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=${version}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.description=Local semantic code search MCP server" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:v${version}"

  # Helm chart: GitHub Pages repo (gh-pages, via chart-releaser) and OCI
  # (ghcr.io/<owner>/charts/codesearch). Runs after the image so the chart's
  # default tag always exists.
  chart:
    needs: [image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # pin@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          # chart-releaser pushes index.yaml to gh-pages with these credentials.
          persist-credentials: true

      # pin@v5.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set chart version and appVersion from the tag
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sed -i -E "s/^version: .*/version: ${version}/; s/^appVersion: .*/appVersion: \"${version}\"/" charts/codesearch/Chart.yaml
          grep -E '^(version|appVersion):' charts/codesearch/Chart.yaml

      - name: Create gh-pages branch if missing
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          git worktree add --orphan -b gh-pages "$RUNNER_TEMP/gh-pages"
          printf 'apiVersion: v1\nentries: {}\n' > "$RUNNER_TEMP/gh-pages/index.yaml"
          touch "$RUNNER_TEMP/gh-pages/.nojekyll"
          git -C "$RUNNER_TEMP/gh-pages" add index.yaml .nojekyll
          git -C "$RUNNER_TEMP/gh-pages" commit -m "chore: initialize Helm repository"
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
          git worktree remove "$RUNNER_TEMP/gh-pages"

      - name: Publish to the GitHub Pages Helm repository
        # pin@v1.7.0
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f
        with:
          charts_dir: charts
          # The chart's GitHub release (codesearch-X.Y.Z) must not replace the
          # binary release as "latest".
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to ghcr.io (OCI)
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          package=".cr-release-packages/codesearch-${version}.tgz"
          [ -f "$package" ] || helm package charts/codesearch --destination .cr-release-packages
          helm push "$package" "oci://ghcr.io/${{ github.repository_owner }}/charts"
