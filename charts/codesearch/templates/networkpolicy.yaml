{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "codesearch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codesearch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "codesearch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- if .Values.networkPolicy.from }}
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
