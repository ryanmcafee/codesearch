{{- if not .Values.auth.existingSecret }}
{{- $name := include "codesearch.apiKeySecretName" . }}
{{- $key := include "codesearch.apiKeySecretKey" . }}
{{- $apiKey := .Values.auth.apiKey }}
{{- if not $apiKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $apiKey = index $existing.data $key | b64dec }}
{{- else }}
{{- $apiKey = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codesearch.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $apiKey | b64enc | quote }}
{{- end }}
