apiVersion: v1
kind: Service
metadata:
  name: {{ include "codesearch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codesearch.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "codesearch.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.serve.port }}
      # The forwarder in networkPolicy mode, serve itself in apiKey mode.
      targetPort: http
      protocol: TCP
