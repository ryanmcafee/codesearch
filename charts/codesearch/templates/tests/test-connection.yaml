apiVersion: v1
kind: Pod
metadata:
  name: {{ include "codesearch.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codesearch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: mcp-initialize
      image: {{ include "codesearch.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          base="http://{{ include "codesearch.fullname" . }}:{{ .Values.service.port }}"
          curl -fsS "$base/healthz"
          curl -fsS -o /dev/null -H "Authorization: Bearer $API_KEY" "$base/metrics"
          curl -fsS -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"helm-test","version":"1"}}}' \
            "$base/mcp" | grep -q '"serverInfo"'
          echo "codesearch answered healthz, metrics and MCP initialize"
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "codesearch.apiKeySecretName" . }}
              key: {{ include "codesearch.apiKeySecretKey" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
